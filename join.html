 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join as a Volunteer</title>
     <link rel="stylesheet" href="./src/output.css">
</head>
<body class="min-h-screen bg-white flex items-center justify-center  px-6 lg:px-10 py-14">

  <div class="w-full max-w-2xl">
    <h2 class=" text-3xl lg:text-5xl  font-family font-bold text-primary-black mb-4">Join as a volunteer</h2>
     <p class="text-secondary-text font-family mb-8 leading-relaxed">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspen varius enim in eros<br> elementum tristique.
    </p>

    <!-- Form -->
    <div class="flex flex-col gap-8">

       
      <div class="flex flex-col sm:flex-row gap-6">
        <div class="flex-1">
          <label class="block text-sm font-family   text-secondary-text mb-8">First Name</label>
          <input
            type="text"
            class="w-full border-b border-gray-300 focus:border-gray-600 outline-none pb-2 text-sm text-gray-800 placeholder-gray-400 bg-transparent"
          />
        </div>
        <div class="flex-1">
          <label class=" block text-sm font-family   text-secondary-text mb-8">Last Name</label>
          <input
            type="text"
            class="w-full border-b border-gray-300 focus:border-gray-600 outline-none pb-2 text-sm text-gray-800 placeholder-gray-400 bg-transparent"
          />
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="  block text-sm font-family   text-secondary-text mb-8">Email Id</label>
        <input
          type="email"
          class="w-full border-b border-gray-300 focus:border-gray-600 outline-none pb-2 text-sm text-gray-800 placeholder-gray-400 bg-transparent"
        />
      </div>

      <!-- Message -->
      <div>
        <label class="  block text-sm font-family   text-secondary-text mb-8">Message</label>
        <textarea
          placeholder="Type your Messege"
          rows="4"
          class="w-full border border-gray-300 focus:border-gray-500 outline-none rounded-md p-3 text-sm text-gray-800 placeholder-gray-400 bg-transparent resize-none"
        ></textarea>
      </div>

      <!-- Submit Button -->
      <div>
        <button class="bg-green1 hover:bg-green-700 text-white font-semibold text-sm px-8 py-3 rounded-md transition-colors mb-12">
          Send message
        </button>
      </div>

    </div>
  </div>

</body>
</html>
